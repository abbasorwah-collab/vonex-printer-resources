name: Vonex Internal Link Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run link audit
        run: python tools/internal-link-builder.py
      - name: Commit report when changed
        run: |
          git config user.name "Vonex SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/internal-link-opportunities.md
          git diff --cached --quiet || git commit -m "Update internal link opportunities"
          git push
